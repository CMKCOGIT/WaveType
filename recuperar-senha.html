<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315FD6">
  <title>Recuperar senha | WaveType</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/wavetype.css">
</head>
<body data-page="recuperar-senha" data-auth-state="guest">
  <main class="auth-page">
    <aside class="auth-aside">
      <a class="brand" href="index.html"><img src="assets/images/wavetype-logo-dark.svg" alt="WaveType"></a>
      <div><span class="eyebrow" style="color:#56DDCA">Acesso seguro</span><h1>Recupere seu ritmo.</h1><p>Solicite o link de redefinição e volte para a sua experiência.</p></div>
    </aside>
    <section class="auth-main" aria-labelledby="recovery-title">
      <div class="auth-card">
        <a class="muted" href="login.html">← Voltar ao login</a>
        <h2 id="recovery-title" style="margin-top:24px">Recuperar senha</h2>
        <p>Informe o e-mail usado na sua conta.</p>
        <form class="auth-form" id="form-recuperacao" name="recuperacao" method="post" data-form="recuperacao" data-endpoint="supabase.auth.resetPasswordForEmail">
          <label class="field" for="recovery-email"><span>E-mail</span><input id="recovery-email" name="email" type="email" autocomplete="email" maxlength="190" required data-field="usuarios.email"></label>
          <p class="sr-only" role="status" aria-live="polite" data-feedback="recuperacao"></p>
          <button class="button block" type="submit" data-action="submit-password-recovery">Enviar link de recuperação</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
