<body data-root="../../" data-role="aluno" data-page="conquistas">
    <div class="app-layout">
        <aside id="app-sidebar" class="app-sidebar"><a class="app-brand" href="../../index.html"

                    src="../../assets/images/brand/wavetype-logo.svg" alt="WaveType"><img class="logo-dark"
                    src="../../assets/images/brand/wavetype-logo-dark.svg" alt=""></a>
            <p class="app-role">Área do aluno</p>
            <nav class="app-nav" aria-label="Navegação da área do aluno"><a href="index.html" data-index="01"><span>Início</span></a><a href="exercicios.html" data-index="02"><span>Exercícios</span></a><a href="turmas.html" data-index="03"><span>Turmas</span></a><a href="resultados.html" data-index="04"><span>Resultados</span></a><a href="conquistas.html" data-index="05" aria-current="page"><span>Conquistas</span></a><a href="ranking.html" data-index="06"><span>Ranking</span></a><a href="perfil.html" data-index="07"><span>Perfil</span></a></nav>
